name: "Jenkins CI Runners"
# Lets Jenkins (and people) find the run of a given build
run-name: "Build ${{ inputs.JENKINS_JOB_NAME }} #${{ inputs.JENKINS_JOB_BUILD_NUMBER }}"
on:
  workflow_dispatch:
    inputs:
      AGENT_HOST:
        description: agent host
        required: true
        type: string
      AGENT_FORWARD_PORT:
        description: agent forward port
        required: true
        type: string
      JENKINS_JOB_NAME:
        description: Jenkins Job Name
        required: true
        type: string
      JENKINS_JOB_BUILD_NUMBER:
        description: Jenkins Job Build Number
        required: true
        type: number
      MAVEN_WAIT_TIMEOUT:
        description: Maven startup wait timeout (seconds, counted from the SSH tunnel being up; must cover Jenkins checkout and source copy)
        required: false
        default: 300
        type: number
      maven_version:
        description: Maven version
        default: "3.9.16"
        required: false
        type: string
      jdk_major_version:
        description: JDK Major version (eg 8, 11, 14, 17, 21,...)
        default: 21
        required: false
        type: number
      maximize_build_space:
        description: Maximize Build Space for Bigger Projects Unit tests based on files and blocks
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  provision:
    name: "Build ${{ inputs.JENKINS_JOB_NAME }} #${{ inputs.JENKINS_JOB_BUILD_NUMBER }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ${{ inputs.JENKINS_JOB_NAME }}
      cancel-in-progress: true

    steps:
      # These inputs end up in an ssh config and in scripts: only accept sane values
      - name: Validate inputs
        run: |
          [[ "${AGENT_HOST}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Invalid AGENT_HOST"; exit 1; }
          [[ "${AGENT_FORWARD_PORT}" =~ ^[0-9]{1,5}$ ]] && (( AGENT_FORWARD_PORT >= 1024 && AGENT_FORWARD_PORT <= 65535 )) || { echo "::error::Invalid AGENT_FORWARD_PORT"; exit 1; }
          [[ "${JENKINS_JOB_NAME}" != *$'\n'* ]] || { echo "::error::Invalid JENKINS_JOB_NAME"; exit 1; }
          [[ "${MAVEN_VERSION}" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::Invalid maven_version"; exit 1; }
          [[ "${JDK_MAJOR_VERSION}" =~ ^[0-9]+$ ]] || { echo "::error::Invalid jdk_major_version"; exit 1; }
        env:
          AGENT_HOST: ${{ inputs.AGENT_HOST }}
          AGENT_FORWARD_PORT: ${{ inputs.AGENT_FORWARD_PORT }}
          JENKINS_JOB_NAME: ${{ inputs.JENKINS_JOB_NAME }}
          MAVEN_VERSION: ${{ inputs.maven_version }}
          JDK_MAJOR_VERSION: ${{ inputs.jdk_major_version }}
      # Hack: free disk space for big & legacy projects (e.g. jcr). Only removes software on the root
      # disk: it works on runner images without a separate /mnt temp disk, which the previous
      # easimon/maximize-build-space action required (it failed with "fallocate: invalid length").
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        if: ${{ inputs.maximize_build_space == true }}
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Setup Maven
      - name: Set up Maven ${{ inputs.maven_version }}
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: ${{ inputs.maven_version }}
      # Restore Cache Maven Artifcats to boost up builds
      - name: Restore Maven artifacts Cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          # Entries are saved as generic-m2-repository-<run_id>-<attempt>: this key never
          # hits exactly, the most recent entry is picked through the prefix.
          key: generic-m2-repository-${{ github.run_id }}
          restore-keys: generic-m2-repository-
      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.PRIVATE_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          config: |
            Host ${{ inputs.AGENT_HOST }}
            HostName ${{ inputs.AGENT_HOST }}
            User ${{ secrets.USERNAME }}
            Port ${{ secrets.PORT }}
      - name: Setup JDK Environment Variables
        run: |
          jdk_var="JAVA_HOME_${JDK_MAJOR_VERSION}_X64"
          jdk_home="${!jdk_var:-}"
          if [ -z "${jdk_home}" ] || [ ! -x "${jdk_home}/bin/java" ]; then
            echo "::error::JDK ${JDK_MAJOR_VERSION} is not available on this runner (${jdk_var} is unset or invalid)"
            exit 1
          fi
          sudo update-alternatives --remove-all java
          sudo update-alternatives --remove-all javac
          echo "export JAVA_HOME=${jdk_home}" | sudo tee -a /etc/profile
          sudo update-alternatives --install /usr/bin/java java "${jdk_home}/bin/java" 9999
          sudo update-alternatives --install /usr/bin/javac javac "${jdk_home}/bin/javac" 9999
        env:
          JDK_MAJOR_VERSION: ${{ inputs.jdk_major_version }}
      # The mvn wrapper Jenkins calls over SSH is installed by daemon.sh
      - name: Setup runnerinfo for SSH Connection
        run: |
          ghaRunnerURL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf '#!/bin/sh\necho "%s"\n' "${ghaRunnerURL}" > runnerinfo
          sudo install -m 755 runnerinfo /usr/bin/runnerinfo
      - name: Init gnupg for signing artifacts
        run: |
          bash initgpg.sh
        env:
          AGENT_HOST: ${{ inputs.AGENT_HOST }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          STRICT_HOST_KEY_CHECKING: ${{ vars.STRICT_HOST_KEY_CHECKING || 'auto' }}
      - name: Connect to agent
        run: |
          echo "Starting agent daemon..."
          bash daemon.sh
        env: 
          MAVEN_WAIT_TIMEOUT: ${{ inputs.MAVEN_WAIT_TIMEOUT }}
          STRICT_HOST_KEY_CHECKING: ${{ vars.STRICT_HOST_KEY_CHECKING || 'auto' }}
          AGENT_HOST: ${{ inputs.AGENT_HOST }}
          AGENT_FORWARD_PORT: ${{ inputs.AGENT_FORWARD_PORT }}
      - name: Stop runner
        if: always()
        run: echo "Job has been stopped"
