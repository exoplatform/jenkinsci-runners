name: "Generate maven cache"
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Rebuild the cache from scratch instead of updating the previous one"
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * *"
permissions:
  contents: read
  actions: write # needed to delete the previous cache entry
env:
  SETTINGS_XML_URL: 'http://storage.exoplatform.org/public/githubci/maven-settings-jenkinsci.xml'
  GH_M2_CACHE: generic-m2-repository
  jdk_major_version: 21
  maven_version: 3.9.16
  node_fallback_version: 26.13.0
  npm_fallback_version: 11.20.0
  # Above this size (KB, uncompressed) warn: GitHub caps a repository at 10 GB and evicts silently
  cache_warn_kb: 8388608
  # Repositories resolved offline before saving, to prove the cache is usable
  smoke_repos: "Meeds-io/maven-parent-pom Meeds-io/kernel"
  repos_list: |
    Meeds-io/maven-parent-pom
    Meeds-io/maven-depmgt-pom
    Meeds-io/kernel
    Meeds-io/portal
    Meeds-io/commons
    Meeds-io/social
    Meeds-io/layout
    Meeds-io/wallet
    Meeds-io/gamification
    Meeds-io/meeds
    exoplatform/maven-exo-parent-pom
    exoplatform/maven-exo-depmgt-pom
    exoplatform/commons-exo
    exoplatform/jcr
    exoplatform/ecms
    exoplatform/agenda
    exoplatform/documents
    exoplatform/processes
    exoplatform/platform-public-distributions
jobs:
  cache:
    name: "Cache maven artifacts"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: cache-artifacts
      cancel-in-progress: true

    steps:
      - name: Setup JDK Environment Variables
        run: |
          jdk_var="JAVA_HOME_${jdk_major_version}_X64"
          jdk_home="${!jdk_var:-}"
          if [ -z "${jdk_home}" ] || [ ! -x "${jdk_home}/bin/java" ]; then
            echo "::error::JDK ${jdk_major_version} is not available on this runner"
            exit 1
          fi
          sudo update-alternatives --remove-all java
          sudo update-alternatives --remove-all javac
          echo "export JAVA_HOME=${jdk_home}" | sudo tee -a /etc/profile
          sudo update-alternatives --install /usr/bin/java java "${jdk_home}/bin/java" 9999
          sudo update-alternatives --install /usr/bin/javac javac "${jdk_home}/bin/javac" 9999
      # Setup Maven
      - name: Set up Maven ${{ env.maven_version }}
        uses: stCarolas/setup-maven@12eb41b233df95d49b0c11fc1b5bc8312e5d4ce0 # v5.1
        with:
          maven-version: ${{ env.maven_version }}
      - name: Prepare environment
        run: |
          mkdir -p ~/.m2
          curl -fsSL --retry 3 "${SETTINGS_XML_URL}" -o ~/.m2/settings.xml
      # Nightly runs update the previous cache (incremental, light on Nexus); Sundays and
      # manual runs with "fresh" start from empty so stale artifacts do not accumulate.
      - name: Decide between incremental and fresh cache
        run: |
          if [ "${{ inputs.fresh }}" = "true" ] || { [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; }; then
            echo "FRESH_CACHE=true" >> "${GITHUB_ENV}"
            echo "Fresh cache rebuild" | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "FRESH_CACHE=false" >> "${GITHUB_ENV}"
            echo "Incremental cache update" | tee -a "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Restore previous Maven artifacts Cache
        if: env.FRESH_CACHE != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ env.GH_M2_CACHE }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ env.GH_M2_CACHE }}-
      - name: Download maven artifacts
        run: |
          # A repo that cannot be resolved (renamed, private, broken pom) must not
          # discard the whole cache: record it and report at the end of the job.
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          : > "${RUNNER_TEMP}/failed-repos"
          : > "${RUNNER_TEMP}/frontend-versions"
          while IFS= read -r fullrepo; do
             fullrepo="$(echo "${fullrepo}" | xargs)"
             [ -z "${fullrepo}" ] && continue
             repo="${workdir}/${fullrepo##*/}"
             echo "::group::${fullrepo}"
             if git clone -q --depth 1 "https://github.com/${fullrepo}" "${repo}" \
                && (cd "${repo}" && mvn -B -ntp dependency:go-offline); then
               echo "OK ${fullrepo}"
               # node/npm bundles are fetched by frontend-maven-plugin at build time, not by
               # go-offline: record the versions this repo resolves (inherited from its parent pom)
               node_v="$(cd "${repo}" && mvn -B -ntp -q -N help:evaluate -Dexpression=node.version -DforceStdout 2>/dev/null || true)"
               npm_v="$(cd "${repo}" && mvn -B -ntp -q -N help:evaluate -Dexpression=npm.version -DforceStdout 2>/dev/null || true)"
               node_v="${node_v#v}"
               if [[ "${node_v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "${npm_v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                 echo "${node_v} ${npm_v}" >> "${RUNNER_TEMP}/frontend-versions"
               fi
             else
               echo "::warning title=Cache::Failed to resolve dependencies of ${fullrepo}"
               echo "${fullrepo}" >> "${RUNNER_TEMP}/failed-repos"
             fi
             rm -rf "${repo}"
             echo "::endgroup::"
          done <<< "$repos_list"
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      - name: Download node & npm bundles
        run: |
          # Versions come from the poms (see above); fall back to the last known pair if none was found
          [ -s "${RUNNER_TEMP}/frontend-versions" ] || echo "${node_fallback_version} ${npm_fallback_version}" > "${RUNNER_TEMP}/frontend-versions"
          m2="${HOME}/.m2/repository/com/github/eirslett"
          sort -u "${RUNNER_TEMP}/frontend-versions" | while read -r node_v npm_v; do
            echo "node ${node_v} / npm ${npm_v}"
            mkdir -p "${m2}/node/${node_v}" "${m2}/npm/${npm_v}"
            curl -fsSL --retry 3 "https://nodejs.org/dist/v${node_v}/node-v${node_v}-linux-x64.tar.gz" -o "${m2}/node/${node_v}/node-${node_v}-linux-x64.tar.gz"
            curl -fsSL --retry 3 "https://registry.npmjs.org/npm/-/npm-${npm_v}.tgz" -o "${m2}/npm/${npm_v}/npm-${npm_v}.tar.gz"
          done
      # Runs before the cleanup (which removes the Meeds/eXo artifacts these repos need): it
      # checks that what was downloaded is complete. Failing here skips the save, so the
      # previous cache entry stays the one provision restores.
      - name: Offline smoke test
        run: |
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          for fullrepo in ${smoke_repos}; do
            if grep -qx "${fullrepo}" "${RUNNER_TEMP}/failed-repos"; then
              echo "Skipping ${fullrepo}: it was not resolved above"
              continue
            fi
            echo "::group::${fullrepo}"
            git clone -q --depth 1 "https://github.com/${fullrepo}" "${workdir}/${fullrepo##*/}"
            if ! (cd "${workdir}/${fullrepo##*/}" && mvn -o -B -ntp dependency:resolve); then
              echo "::error title=Cache::${fullrepo} does not resolve offline from the downloaded artifacts: cache not saved"
              exit 1
            fi
            echo "::endgroup::"
          done
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      - name: Cleanup Meeds and eXo artifacts
        run: |
          rm -rf ~/.m2/repository/io/meeds
          rm -rf ~/.m2/repository/org/exoplatform
          rm -rf ~/.m2/repository/com/exoplatform
      # A failed lookup recorded at cache time would be replayed by every later build, and
      # _remote.repositories ties artifacts to the repository ids used here.
      - name: Strip resolver metadata
        run: |
          find ~/.m2/repository \( -name '*.lastUpdated' -o -name 'resolver-status.properties' -o -name '_remote.repositories' \) -type f -delete
      - name: Report cache size
        run: |
          # The cache is one entry per repository and capped by GitHub (10 GB): watch the growth
          du -sh ~/.m2/repository | tee -a "${GITHUB_STEP_SUMMARY}"
          size_kb="$(du -sk ~/.m2/repository | cut -f1)"
          if [ "${size_kb}" -gt "${cache_warn_kb}" ]; then
            echo "::warning title=Cache::Maven cache is ${size_kb} KB, close to the 10 GB GitHub limit: older entries may be evicted"
          fi
      # Save under a unique key first, then drop the older entries: there is never
      # a moment without a usable cache (provision restores by key prefix).
      - name: Save Maven artifacts Cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ env.GH_M2_CACHE }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Drop old caches
        run: |
          current="${GH_M2_CACHE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh cache list -R "${GITHUB_REPOSITORY}" --key "${GH_M2_CACHE}" --limit 100 --json key -q '.[].key' \
            | grep -vx "${current}" \
            | while read -r key; do
                echo "Deleting old cache ${key}"
                gh cache delete "${key}" -R "${GITHUB_REPOSITORY}" || true
              done || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail if some repositories could not be cached
        run: |
          if [ -s "${RUNNER_TEMP}/failed-repos" ]; then
            echo "::error title=Cache::Not cached (cache saved without them):"
            cat "${RUNNER_TEMP}/failed-repos"
            exit 1
          fi
